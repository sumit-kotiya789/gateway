# Local development stack. Ports bind to 127.0.0.1 only.
# Custodial mode (M7) is opt-in: `docker compose --profile custodial up` adds the signer (RUNBOOK "Custody setup").
x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp"]

x-app-env: &app-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://gateway_app:${APP_DB_PASSWORD:?}@postgres:5432/gateway
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?set in .env}
  ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?set in .env}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?set in .env}
  DATA_KEK: ${DATA_KEK:?set in .env}
  DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS:-}
  ADMIN_ORIGINS: ${ADMIN_ORIGINS:-}
  WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}
  # Dev stack: every email lands in Mailpit (http://localhost:8025). Links point at DASHBOARD_URL.
  SMTP_URL: smtp://mailpit:1025
  EMAIL_FROM: ${EMAIL_FROM:-Gateway <no-reply@localhost>}
  DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:8080}
  FEATURE_CUSTODIAL: ${FEATURE_CUSTODIAL:-false}

# Registry rpc_urls reference these as ${NAME}; unset = that URL is skipped.
x-rpc-env: &rpc-env
  EVM_LOCAL_RPC_URL: http://anvil:8545
  BSC_RPC_URL: ${BSC_RPC_URL:-}
  BSC_TESTNET_RPC_URL: ${BSC_TESTNET_RPC_URL:-}

services:
  migrate:
    <<: *hardened
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["node", "cli/migrate.cjs"]
    environment:
      DATABASE_MIGRATION_URL: postgres://gateway:${POSTGRES_PASSWORD:?}@postgres:5432/gateway
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *hardened
    build: { context: ., dockerfile: apps/server/Dockerfile }
    environment:
      <<: *app-env
      PORT: "3000"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    <<: *hardened
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["node", "--enable-source-maps", "main-worker.cjs"]
    environment:
      <<: [*app-env, *rpc-env]
      # Custodial only. The worker is the one process that talks to the signer (the api never gets this secret).
      SIGNER_URL: ${SIGNER_URL:-http://signer:3100}
      SIGNER_HMAC_SECRET: ${SIGNER_HMAC_SECRET:-}
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  watcher:
    <<: *hardened
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["node", "--enable-source-maps", "main-watcher.cjs"]
    environment:
      <<: [*app-env, *rpc-env]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Dashboard SPA + same-origin proxy for /v1/dashboard/* (http://localhost:${DASHBOARD_HOST_PORT:-8080}).
  dashboard:
    <<: *hardened
    build: { context: ., dockerfile: apps/dashboard/Dockerfile }
    ports: ["127.0.0.1:${DASHBOARD_HOST_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_started }

  # Admin console SPA + same-origin proxy for /admin/v1/* (http://localhost:${ADMIN_HOST_PORT:-8081}/admin/). Own origin (D-025).
  admin:
    <<: *hardened
    build: { context: ., dockerfile: apps/admin/Dockerfile }
    ports: ["127.0.0.1:${ADMIN_HOST_PORT:-8081}:8080"]
    depends_on:
      api: { condition: service_started }

  # Custodial only (profile `custodial`). Production runs it on its own host with mTLS and a KMS seed (D-088, D-010);
  # here: plain HTTP on the compose network, no host port, the dev seed sealed in the signerdata volume.
  # First run: `docker compose --profile custodial run --rm -T signer node cli/init-seed.cjs` (prints what to register).
  # Needs SIGNER_DB_PASSWORD, SIGNER_HMAC_SECRET and SIGNER_SEED_KEK in .env; the signer refuses to start without them.
  signer:
    <<: *hardened
    profiles: [custodial]
    build: { context: ., dockerfile: apps/signer/Dockerfile }
    environment:
      <<: *rpc-env
      NODE_ENV: development
      SIGNER_HOST: 0.0.0.0
      SIGNER_PORT: "3100"
      SIGNER_DATABASE_URL: postgres://gateway_signer:${SIGNER_DB_PASSWORD:-}@postgres:5432/gateway
      SIGNER_HMAC_SECRET: ${SIGNER_HMAC_SECRET:-}
      SIGNER_SEED_FILE: /data/signer-seed.json
      SIGNER_SEED_KEK: ${SIGNER_SEED_KEK:-}
      SIGNER_LIMITS: ${SIGNER_LIMITS:-{}}
      SIGNER_COLD_ADDRESSES: ${SIGNER_COLD_ADDRESSES:-}
      SIGNER_MAX_GAS_PRICE_GWEI: ${SIGNER_MAX_GAS_PRICE_GWEI:-20}
      SIGNER_MAX_GAS_TOPUP: ${SIGNER_MAX_GAS_TOPUP:-0.005}
      SIGNER_PAUSED: ${SIGNER_PAUSED:-false}
    volumes: [signerdata:/data]
    depends_on:
      migrate: { condition: service_completed_successfully }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      # Optional: creates the signer's login (custodial) on a fresh data dir.
      SIGNER_DB_PASSWORD: ${SIGNER_DB_PASSWORD:-}
    ports: ["127.0.0.1:${PG_HOST_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    volumes: [redisdata:/data]

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
    ports: ["127.0.0.1:8545:8545"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

volumes:
  pgdata:
  redisdata:
  signerdata:
