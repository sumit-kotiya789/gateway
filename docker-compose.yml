# Local development stack. Ports bind to 127.0.0.1 only.
# worker, watcher, signer services are added in the milestones that create them (M3/M4/M7).
x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp"]

services:
  api:
    <<: *hardened
    build: { context: ., dockerfile: apps/server/Dockerfile }
    environment:
      NODE_ENV: development
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [postgres, redis]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
    ports: ["127.0.0.1:8545:8545"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

volumes:
  pgdata:
  redisdata:
