# Serves the dashboard SPA and forwards its API path to the api (same origin, D-029).
# Plain HTTP on :8080; TLS terminates at the edge proxy in front (see docs/RUNBOOK.md).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 128k;

    # add_header in a location replaces the server-level set, so every location includes the same file.
    include /etc/nginx/security-headers.conf;

    location /v1/dashboard/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
