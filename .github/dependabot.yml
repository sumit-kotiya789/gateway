version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # React refuses to run when react and react-dom differ (blank page): always bump them together.
    groups:
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # Node stays on the LTS line chosen in D-004: digest and minor bumps only.
  - package-ecosystem: docker
    directories: [/apps/server, /apps/signer, /apps/dashboard, /apps/admin]
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
